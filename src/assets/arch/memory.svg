<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;}</style>
  <defs>
    <marker id="m-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="m-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="m-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="m-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="m-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="m-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480.0" y="34" font-size="17" fill="#111827" font-weight="700" text-anchor="middle">Memory 岛架构 —— 全局记忆统一真身 × 项目 .ai/ 桥接</text>
  <rect x="54" y="76" width="250" height="84" rx="8" ry="8" fill="#eff6ff" stroke="#4aa3df" stroke-width="1.5"/>
  <text x="179.0" y="101.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">~/.zcode/AGENTS.md</text>
  <text x="179.0" y="118" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">文件符号链接 → 真身</text>
  <text x="179.0" y="134" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">默认只读（需显式解锁）</text>
  <rect x="355" y="76" width="250" height="96" rx="8" ry="8" fill="#ddf3e9" stroke="#3eb489" stroke-width="1.5"/>
  <text x="480.0" y="101.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">~/.agenthub/MEMORY.md</text>
  <text x="480.0" y="118" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">双端唯一真身 · 共写唯一入口</text>
  <text x="480.0" y="134" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">编辑 → 解析链接到真身</text>
  <text x="480.0" y="150" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">→ 备份 → 原子写</text>
  <rect x="656" y="76" width="250" height="84" rx="8" ry="8" fill="#f0fdf4" stroke="#2e9e74" stroke-width="1.5"/>
  <text x="781.0" y="101.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">WB 用户级 MEMORY.md</text>
  <text x="781.0" y="118" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">user-*-personal/MEMORY.md</text>
  <text x="781.0" y="134" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">文件符号链接 → 真身</text>
  <rect x="355" y="212" width="250" height="72" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480.0" y="237.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">unify_global_memory（幂等）</text>
  <text x="480.0" y="254" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">种子合并 → 备份 → 建链 → 失败还原</text>
  <text x="480.0" y="270" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">预检：无法建 symlink 则整体不动</text>
  <text x="480" y="296" font-size="12" fill="#6b7280" font-weight="600" text-anchor="middle">—  项目记忆 · .ai/ 桥接  —</text>
  <rect x="54" y="330" width="250" height="104" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="179.0" y="355.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">项目注册（自动）</text>
  <text x="179.0" y="372" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">ZCode recentProjects</text>
  <text x="179.0" y="388" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">WB workbuddy.db sessions.cwd</text>
  <text x="179.0" y="404" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">projects 表（去缓存/去重）</text>
  <rect x="355" y="330" width="250" height="104" rx="8" ry="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="480.0" y="355.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">init</text>
  <text x="480.0" y="372" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">创建 .ai/：PROJECT.md / MEMORY.md</text>
  <text x="480.0" y="388" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">memory/&lt;日期&gt;.md 按日追加</text>
  <text x="480.0" y="404" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">注入 agent-hub 标记块</text>
  <text x="480.0" y="420" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">→ AGENTS.md / CLAUDE.md（幂等 upsert）</text>
  <rect x="656" y="330" width="250" height="104" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="781.0" y="355.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">sync / 漂移检测</text>
  <text x="781.0" y="372" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">FNV-1a 全文指纹</text>
  <text x="781.0" y="388" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">vs bridge_targets.block_hash</text>
  <text x="781.0" y="404" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">漂移 → 恢复标记块</text>
  <rect x="355" y="470" width="250" height="76" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480.0" y="495.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">consolidate 蒸馏候选</text>
  <text x="480.0" y="512" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">.workbuddy/memory/*.md</text>
  <text x="480.0" y="528" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">未入 .ai/MEMORY.md 的行（粗估）</text>
  <rect x="54" y="470" width="250" height="100" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="179.0" y="495.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">桥接块标记</text>
  <text x="179.0" y="512.0" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">&lt;!-- agent-hub:start --&gt;</text>
  <text x="179.0" y="527.5" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">……共享记忆约定……</text>
  <text x="179.0" y="543.0" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">&lt;!-- agent-hub:end --&gt;</text>
  <rect x="656" y="470" width="250" height="100" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="781.0" y="495.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">隐私与路径安全</text>
  <text x="781.0" y="512.0" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">仅允许 ~/.workbuddy / ~/.zcode</text>
  <text x="781.0" y="527.5" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">~/.agenthub 与已注册项目目录</text>
  <text x="781.0" y="543.0" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">WB 系统记忆文件（RAW_JSON）永不列出</text>
  <line x1="304" y1="118" x2="355" y2="118" stroke="#16a34a" stroke-width="1.8" marker-end="url(#m-green)"/>
  <rect x="285.0" y="95.5" width="90" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="330" y="107.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">symlink</text>
  <line x1="656" y1="118" x2="605" y2="118" stroke="#16a34a" stroke-width="1.8" marker-end="url(#m-green)"/>
  <rect x="585.0" y="95.5" width="90" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="630" y="107.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">symlink</text>
  <line x1="480" y1="172" x2="480" y2="212" stroke="#6b7280" stroke-width="1.8" marker-end="url(#m-gray)" stroke-dasharray="4,3"/>
  <rect x="452.0" y="183.5" width="56" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="480" y="195.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">统一建链</text>
  <line x1="304" y1="382" x2="355" y2="382" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m-orange)"/>
  <rect x="285.0" y="359.5" width="90" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="330" y="371.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">注册→init</text>
  <line x1="605" y1="362" x2="656" y2="362" stroke="#6b7280" stroke-width="1.8" marker-end="url(#m-gray)" stroke-dasharray="4,3"/>
  <rect x="602.0" y="339.5" width="56" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="630" y="351.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">指纹登记</text>
  <line x1="656" y1="402" x2="605" y2="402" stroke="#16a34a" stroke-width="1.8" marker-end="url(#m-green)"/>
  <rect x="596.5" y="415.5" width="67" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="630" y="427.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">恢复标记块</text>
  <line x1="480" y1="434" x2="480" y2="470" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
  <rect x="463.5" y="443.5" width="33" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="480" y="455.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">蒸馏</text>
  <rect x="16" y="606" width="928" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="36" y1="619" x2="62" y2="619" stroke="#16a34a" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="68" y="623" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">建链/写入</text>
  <line x1="151" y1="619" x2="177" y2="619" stroke="#ea580c" stroke-width="2" marker-end="url(#m-orange)"/>
  <text x="183" y="623" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">UI 控制</text>
  <line x1="266" y1="619" x2="292" y2="619" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="298" y="623" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">同步/蒸馏</text>
  <line x1="381" y1="619" x2="407" y2="619" stroke="#6b7280" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="413" y="623" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">状态（虚线）</text>
</svg>