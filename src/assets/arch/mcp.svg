<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <style>text{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Microsoft YaHei',sans-serif;}</style>
  <defs>
    <marker id="m-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="m-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
    <marker id="m-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="m-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/></marker>
    <marker id="m-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/></marker>
    <marker id="m-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
  </defs>
  <rect width="960" height="620" fill="#ffffff"/>
  <text x="480.0" y="34" font-size="17" fill="#111827" font-weight="700" text-anchor="middle">MCP 岛架构 —— 统一定义 × 双格式翻译 × 合并式写入</text>
  <rect x="330" y="56" width="300" height="64" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480.0" y="81.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">AgentHub · MCP 岛</text>
  <text x="480.0" y="98" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">增删改 / 双端启停 / 校验漂移</text>
  <rect x="676" y="56" width="230" height="104" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="791.0" y="81.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">validate 漂移校验</text>
  <text x="791.0" y="98" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">DB × 双端实测逐条比对</text>
  <text x="791.0" y="114" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">ok / disabled / missing / drifted</text>
  <text x="791.0" y="130" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">wb_only / zcode_only 未收编</text>
  <path d="M 350 201 A 130.0 11 0 0 1 610 201 L 610 309 A 130.0 11 0 0 1 350 309 Z" fill="#ddf3e9" stroke="none"/>
  <ellipse cx="480.0" cy="201" rx="130.0" ry="11" fill="#ddf3e9" stroke="#3eb489" stroke-width="1.5"/>
  <path d="M 350 201 L 350 309 A 130.0 11 0 0 0 610 309 L 610 201" fill="none" stroke="#3eb489" stroke-width="1.5"/>
  <text x="480.0" y="227.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">SQLite · mcp_servers</text>
  <text x="480.0" y="245" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">name / type / command / args / url</text>
  <text x="480.0" y="261" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">env / headers（远程鉴权）</text>
  <text x="480.0" y="277" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">enabled_wb × enabled_zcode</text>
  <rect x="54" y="250" width="230" height="96" rx="8" ry="8" fill="#f0fdf4" stroke="#2e9e74" stroke-width="1.5"/>
  <text x="169.0" y="275.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">~/.workbuddy/mcp.json</text>
  <text x="169.0" y="292" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">{ mcpServers: {…} }</text>
  <text x="169.0" y="308" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">状态字段：disabled</text>
  <text x="169.0" y="324" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">支持 stdio / streamableHttp</text>
  <rect x="676" y="250" width="230" height="96" rx="8" ry="8" fill="#eff6ff" stroke="#4aa3df" stroke-width="1.5"/>
  <text x="791.0" y="275.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">~/.zcode/cli/config.json</text>
  <text x="791.0" y="292" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">{ mcp: { servers: {…} } }</text>
  <text x="791.0" y="308" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">状态字段：enabled</text>
  <text x="791.0" y="324" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">不支持 HTTP 型 → unsupported</text>
  <rect x="280" y="440" width="400" height="110" rx="8" ry="8" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="480.0" y="465.0" font-size="13.5" fill="#111827" font-weight="600" text-anchor="middle">sync_all 全量同步 · write_json_preserving</text>
  <text x="480.0" y="482" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">双格式翻译：disabled ↔ enabled（合并保留 timeout/headers 等非托管键）</text>
  <text x="480.0" y="498" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">合并式写入：仅覆盖本端容器，其余键原样保留</text>
  <text x="480.0" y="514" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">备份 → 原子写(tmp+rename) → JSON 校验</text>
  <text x="480.0" y="530" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">单端独有 server 不铺另一端（未添加 ≠ 禁用）</text>
  <line x1="480" y1="120" x2="480" y2="190" stroke="#ea580c" stroke-width="1.8" marker-end="url(#m-orange)"/>
  <rect x="440.5" y="146.5" width="79" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="480" y="158.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">增删改/启停</text>
  <path d="M 169 250 V 160 H 350 V 226" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#m-green)" stroke-dasharray="5,3"/>
  <rect x="124.0" y="151.5" width="252" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="250" y="163.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">收编 adopt（冲突以 WB 字段为准）</text>
  <path d="M 791 250 V 160 H 610 V 226" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#m-green)" stroke-dasharray="5,3"/>
  <rect x="689.0" y="151.5" width="102" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="740" y="163.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">收编 adopt</text>
  <line x1="480" y1="320" x2="480" y2="440" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
  <rect x="429.0" y="371.5" width="102" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="480" y="383.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">sync_all</text>
  <path d="M 280 470 H 169 V 346" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
  <rect x="203.5" y="431.5" width="33" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="220" y="443.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">写入</text>
  <path d="M 680 470 H 791 V 346" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#m-blue)"/>
  <rect x="723.5" y="431.5" width="33" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="740" y="443.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">写入</text>
  <path d="M 610 230 H 640 V 108 H 676" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#m-gray)" stroke-dasharray="4,3"/>
  <rect x="623.5" y="161.5" width="33" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="640" y="173.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">比对</text>
  <line x1="791" y1="250" x2="791" y2="160" stroke="#6b7280" stroke-width="1.8" marker-end="url(#m-gray)" stroke-dasharray="4,3"/>
  <rect x="803.5" y="196.5" width="33" height="17" fill="#ffffff" opacity="0.95" rx="3"/>
  <text x="820" y="208.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">实测</text>
  <rect x="16" y="586" width="928" height="26" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="36" y1="599" x2="62" y2="599" stroke="#2563eb" stroke-width="2" marker-end="url(#m-blue)"/>
  <text x="68" y="603" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">同步写入</text>
  <line x1="140" y1="599" x2="166" y2="599" stroke="#16a34a" stroke-width="2" marker-end="url(#m-green)"/>
  <text x="172" y="603" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">收编（虚线）</text>
  <line x1="267" y1="599" x2="293" y2="599" stroke="#ea580c" stroke-width="2" marker-end="url(#m-orange)"/>
  <text x="299" y="603" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">UI 控制</text>
  <line x1="382" y1="599" x2="408" y2="599" stroke="#6b7280" stroke-width="2" marker-end="url(#m-gray)"/>
  <text x="414" y="603" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">实测/比对（虚线）</text>
</svg>